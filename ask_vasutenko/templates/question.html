{% extends "base.html" %}
{% load static %}

{% block title %}
    Questions
{% endblock %}

{% block main-content %}
    {% include 'question_card.html' %}

    <div class="divider"></div>

    <section class="answers">
        {% for answer in page %}
            {% include 'answer_card.html' %}
        {% endfor %}
    </section>

    {% include 'pagination.html' %}

    <div class="divider"></div>
    <form action="#" class="answer-form" method="post">
        {% csrf_token %}
        <textarea name="content" cols="30" rows="10" maxlength="5000" required>{% if form.content.value %}{{ form.content.value }}{% endif %}</textarea>
        <button type="submit" class="form-submit">Answer</button>
    </form>

    <script src="{% static 'js/app.js' %}"></script>
{% endblock %}
